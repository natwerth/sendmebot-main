<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <?!= includeHtml_("Modal") ?>

  </head>

  <body>
    <div class="wrap">

      <div class="field">
        <label for="imageName">Image name</label>
        <input id="imageName" type="text" placeholder="Header Image">
      </div>

      <div class="field">
        <label for="imageLink">Shared Drive link</label>
        <input id="imageLink" type="text" placeholder="https://drive.google.com/file/d/...">
      </div>

      <div class="field">
        <label for="imageWidth">Width (px)</label>
        <input id="imageWidth" type="text" placeholder="320">
        <div class="hint">
          Leave as 320 if unsure.
        </div>
      </div>

      <div id="status" class="message status"></div>
      <div id="error" class="message error"></div>

      <div class="button-row">
        <button class="secondary" onclick="google.script.host.close()">Cancel</button>
        <button id="saveButton" class="primary" onclick="saveImage()">Save</button>
      </div>
    </div>

    <script>
      function saveImage() {
        clearMessages();

        const saveButton = document.getElementById("saveButton");

        const formData = {
          name: document.getElementById("imageName").value,
          link: document.getElementById("imageLink").value,
          width: document.getElementById("imageWidth").value || "320"
        };

        if (!formData.name.trim()) {
          showError("Image name is required.");
          return;
        }

        if (!formData.link.trim()) {
          showError("Drive link or file ID is required.");
          return;
        }

        SendMeBotModal.setButtonBusy(saveButton, true, "Saving...", "Save");

        google.script.run
          .withSuccessHandler(function(result) {
            document.getElementById("status").textContent =
              result.title + "\n" + result.message;

            saveButton.textContent = "Saved";

            setTimeout(function() {
              google.script.host.close();
            }, 900);
          })
          .withFailureHandler(function(error) {
            showError(SendMeBotModal.errorText(error));
            SendMeBotModal.setButtonBusy(saveButton, false, "Saving...", "Save");
          })
          .saveImageAsset(formData);
      }

      function clearMessages() {
        SendMeBotModal.clearText(["status", "error"]);
      }

      function showError(message) {
        document.getElementById("error").textContent =
          message || "Something went wrong.";
      }
    </script>
  </body>
</html>
