<style>
  :root {
    --google-blue: #0b57d0;
    --google-blue-hover-bg: #eef2fb;
    --text-primary: #1f1f1f;
    --text-secondary: #5f6368;
    --placeholder: #9aa0a6;
    --border: #dadce0;
    --focus-blue: #1a73e8;
    --error: #b3261e;
    --success: #137333;
    --chip-bg: #f8fafd;
    --chip-border: #d2e3fc;
  }

  * { box-sizing: border-box; }

  html,
  body {
    margin: 0;
    font-family: "Roboto", Arial, sans-serif;
    color: var(--text-primary);
    background: #ffffff;
  }

  .wrap,
  .dialog { padding: 0; }
  .field { margin-bottom: 14px; }
  .hidden { display: none; }

  label {
    display: block;
    margin-bottom: 6px;
    font-size: 13px;
    color: #3c4043;
  }

  input,
  select {
    width: 100%;
    height: 36px;
    padding: 6px 10px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: #ffffff;
    color: var(--text-primary);
    font-family: "Roboto", Arial, sans-serif;
    font-size: 14px;
  }

  input::placeholder { color: var(--placeholder); }
  input:focus::placeholder { color: transparent; }

  input:focus,
  select:focus {
    border: 2px solid var(--focus-blue);
    outline: none;
  }

  .intro {
    margin-bottom: 14px;
    color: var(--text-secondary);
    font-size: 13px;
    line-height: 1.4;
  }

  .hint,
  .helper {
    margin-top: 5px;
    color: var(--text-secondary);
    font-size: 12px;
    line-height: 1.35;
  }

  .message {
    margin-top: 10px;
    font-size: 13px;
    line-height: 1.4;
    white-space: pre-wrap;
  }

  .error { color: var(--error); }
  .status { color: var(--success); }

  .button-row {
    display: flex;
    justify-content: flex-end;
    align-items: center;
    gap: 8px;
    margin-top: 18px;
  }

  button {
    min-width: 64px;
    height: 36px;
    padding: 0 14px;
    border: none;
    border-radius: 18px;
    font-family: "Roboto", Arial, sans-serif;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
  }

  button.secondary,
  button.primary {
    background: #ffffff;
    color: var(--google-blue);
  }

  button.secondary:hover,
  button.primary:hover { background: var(--google-blue-hover-bg); }

  button:disabled {
    background: #f1f3f4;
    color: #9aa0a6;
    cursor: not-allowed;
  }
</style>

<script>
  window.SendMeBotModal = {
    errorText: function(error, fallback) {
      return error && error.message ? error.message : (fallback || "Something went wrong.");
    },
    setButtonBusy: function(button, busy, busyText, idleText) {
      button.disabled = !!busy;
      button.textContent = busy ? busyText : idleText;
    },
    clearText: function(ids) {
      (ids || []).forEach(function(id) {
        const element = document.getElementById(id);
        if (element) element.textContent = "";
      });
    }
  };
</script>
