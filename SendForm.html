<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <?!= includeHtml_("Modal") ?>

    <style>
      :root {
        --status-yellow-bg: #fff2cc;
        --status-yellow-text: #7f5f00;
        --status-green-bg: #d9ead3;
        --status-green-text: #137333;
        --status-red-bg: #f4cccc;
        --status-red-text: #b3261e;
      }

      .meta {
        margin-bottom: 18px;
        font-size: 14px;
        line-height: 1.4;
        color: #3c4043;
      }

      .meta strong {
        color: var(--text-primary);
        font-weight: 600;
      }

      .warning {
        margin-top: 6px;
        color: #b06000;
        font-size: 13px;
        line-height: 1.3;
      }

      .field {
        margin-bottom: 18px;
      }

      .tracking-option {
        display: flex;
        align-items: flex-start;
        gap: 8px;
        margin: -10px 0 18px;
        color: var(--text-secondary);
        font-size: 13px;
        line-height: 1.35;
      }

      .tracking-option.hidden {
        display: none;
      }

      .tracking-option input {
        flex: 0 0 auto;
        width: 16px;
        height: 16px;
        margin: 1px 0 0;
        padding: 0;
        border: initial;
        border-radius: 0;
        background: initial;
        appearance: auto;
      }

      .tracking-option input:focus {
        border: initial;
        outline: auto;
      }

      .tracking-option label {
        margin: 0;
        color: var(--text-primary);
        font-size: 13px;
      }

      .tracking-helper {
        margin-top: 3px;
        color: var(--text-secondary);
        font-size: 12px;
      }

      .sender-card,
      .sender-onboarding {
        margin-bottom: 18px;
        padding: 12px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: #f8fafd;
      }

      .sender-title {
        margin-bottom: 6px;
        color: #3c4043;
        font-size: 13px;
        font-weight: 600;
      }

      .sender-name {
        font-size: 15px;
        font-weight: 600;
      }

      .sender-email,
      .helper-text {
        color: var(--text-secondary);
        font-size: 12px;
        line-height: 1.4;
      }

      .sender-onboarding textarea {
        width: 100%;
        min-height: 72px;
        padding: 8px 10px;
        resize: vertical;
        border: 1px solid var(--border);
        border-radius: 4px;
        font: 14px/1.4 "Roboto", Arial, sans-serif;
      }

      .inline-actions {
        display: flex;
        justify-content: flex-end;
        margin-top: 8px;
      }

      .form-message {
        margin: 8px 0;
        font-size: 13px;
        line-height: 1.4;
        white-space: pre-line;
      }

      .form-message.error {
        color: var(--error);
      }

      .form-message.success {
        color: var(--success);
      }

      .schedule-row {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 96px;
        gap: 8px;
      }

      .schedule-helper {
        margin: -8px 0 18px;
        color: var(--text-secondary);
        font-size: 12px;
        line-height: 1.4;
      }

      .schedule-error {
        margin-top: 5px;
        color: var(--error);
      }

      label {
        display: block;
        margin-bottom: 8px;
        font-size: 14px;
        font-weight: 400;
        color: #3c4043;
      }

      select,
      input {
        width: 100%;
        height: 38px;
        padding: 6px 10px;
        border: 1px solid var(--border);
        border-radius: 4px;
        background: #ffffff;
        color: var(--text-primary);
        font-family: "Roboto", Arial, sans-serif;
        font-size: 15px;
        line-height: 1.35;
      }

      select:hover,
      input:hover {
        border-color: #bdc1c6;
      }

      select:focus,
      input:focus {
        border: 3px solid var(--focus-blue);
        border-color: var(--focus-blue);
        outline: none;
        box-shadow: none;
      }

      .recipient-toggle-row {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-top: -8px;
        margin-bottom: 18px;
      }

      .mini-button {
        min-width: 0;
        height: 28px;
        padding: 0 10px;
        border-radius: 14px;
        background: #ffffff;
        color: var(--google-blue);
        border: 1px solid var(--chip-border);
        font-size: 12px;
        font-weight: 500;
      }

      .mini-button:hover {
        background: var(--google-blue-hover-bg);
      }

      .recipient-panel {
        margin-top: -6px;
        margin-bottom: 18px;
        padding: 10px;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: #ffffff;
      }

      .recipient-panel-title {
        margin-bottom: 8px;
        font-size: 13px;
        font-weight: 600;
        color: #3c4043;
      }

      .recipient-chips {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }

      .recipient-chip {
        min-width: 0;
        height: 28px;
        border: 1px solid var(--chip-border);
        border-radius: 999px;
        padding: 0 10px;
        background: #ffffff;
        color: var(--google-blue);
        font-size: 12px;
        font-weight: 500;
        cursor: pointer;
        user-select: none;
      }

      .recipient-chip:hover {
        background: var(--google-blue-hover-bg);
      }

      .recipient-chip.active {
        background: var(--google-blue-hover-bg);
        border-color: var(--google-blue);
        color: var(--google-blue);
        font-weight: 700;
      }

      .empty-state {
        margin: 0;
        font-size: 13px;
        line-height: 1.4;
        color: var(--text-secondary);
      }

      .button-row {
        display: flex;
        justify-content: flex-end;
        align-items: center;
        gap: 8px;
        margin-top: 14px;
      }

      button.status-working:disabled {
        background: var(--status-yellow-bg);
        color: var(--status-yellow-text);
      }

      button.status-success:disabled {
        background: var(--status-green-bg);
        color: var(--status-green-text);
      }

      button.status-failed {
        background: var(--status-red-bg);
        color: var(--status-red-text);
      }

      button.status-failed:hover {
        background: var(--status-red-bg);
      }
    </style>
  </head>

  <body>
    <div class="dialog">
      <div class="meta">
        <div><strong id="selectedRowLabel">Emails:</strong> <span id="selectedRowCount">Loading...</span></div>

        <div id="selectionWarning" class="warning hidden">
          No rows selected. Use the Select column to select recipients.
        </div>
      </div>

      <div class="field">
        <label for="template">Template</label>
        <select id="template">
          <option value="">Loading templates...</option>
        </select>
      </div>

      <div id="trackingOption" class="tracking-option hidden">
        <input id="createTrackingColumn" type="checkbox" onchange="updateSubmitButton()">
        <div>
          <label for="createTrackingColumn">Create tracking column</label>
          <div id="trackingHelper" class="tracking-helper"></div>
        </div>
      </div>

      <div id="senderReady" class="sender-card hidden" aria-live="polite">
        <div class="sender-title">Sending from</div>
        <div id="senderDisplayName" class="sender-name"></div>
        <div id="senderDisplayEmail" class="sender-email"></div>
      </div>

      <div id="senderOnboarding" class="sender-onboarding hidden">
        <div class="sender-title">Set up your sender profile</div>
        <div class="field">
          <label for="senderProfileEmail">Email</label>
          <input id="senderProfileEmail" type="email" readonly aria-readonly="true">
        </div>
        <div class="field">
          <label for="senderProfileName">Name</label>
          <input id="senderProfileName" type="text" autocomplete="name">
        </div>
        <div class="field">
          <label for="senderProfileSignature">Signature</label>
          <textarea id="senderProfileSignature" placeholder="All the best,&#10;Your name"></textarea>
        </div>
        <div id="senderProfileError" class="form-message error hidden" role="alert"></div>
        <div class="inline-actions">
          <button id="saveSenderButton" type="button" class="primary" onclick="saveInlineSenderProfile()">Save profile</button>
        </div>
      </div>

      <div id="senderBlockingError" class="form-message error hidden" role="alert"></div>

      <div class="field">
        <label for="toField">To</label>
        <select id="toField">
          <option value="">Loading recipient fields...</option>
        </select>
      </div>

      <div class="recipient-toggle-row">
        <button id="ccToggle" type="button" class="mini-button" onclick="toggleRecipientPanel('cc')">+ CC</button>
        <button id="bccToggle" type="button" class="mini-button" onclick="toggleRecipientPanel('bcc')">+ BCC</button>
      </div>

      <div id="ccPanel" class="recipient-panel hidden">
        <div class="recipient-panel-title">CC</div>
        <div id="ccChips" class="recipient-chips"></div>
      </div>

      <div id="bccPanel" class="recipient-panel hidden">
        <div class="recipient-panel-title">BCC</div>
        <div id="bccChips" class="recipient-chips"></div>
      </div>

      <div id="scheduleFields" class="hidden">
        <div class="schedule-row">
          <div class="field">
            <label for="scheduleDate">Send on</label>
            <input id="scheduleDate" type="date">
          </div>
          <div class="field">
            <label for="scheduleTime">at</label>
            <input id="scheduleTime" type="time" step="60">
          </div>
        </div>

        <div class="schedule-helper">
          <div id="scheduleTimeZone">Times use your browser timezone.</div>
          <div>Scheduled emails are processed periodically and may send several minutes after the selected time.</div>
          <div id="triggerState"></div>
          <div id="scheduleError" class="schedule-error hidden"></div>
        </div>
      </div>

      <div id="completionMessage" class="form-message hidden" role="status" aria-live="polite"></div>

      <div class="button-row">
        <button id="cancelButton" class="secondary" onclick="google.script.host.close()">Cancel</button>
        <button id="submitButton" class="primary" onclick="submitForm()">OK</button>
      </div>
    </div>

    <script>
      const context = <?!= contextJson ?>;
      let selectedRowCount = Number(context.selectedRowCount || 0);
      let isSubmitting = false;
      let lastTrackingTemplate = "";

      function initializeForm() {
        const rowLabel = context.actionMode === "schedule"
          ? "Emails to schedule:"
          : "Emails to send:";

        document.getElementById("selectedRowLabel").textContent = rowLabel;

        document.getElementById("selectedRowCount").textContent = selectedRowCount;

        populateSelect("template", context.templates || []);
        document.getElementById("template").addEventListener("change", renderTrackingOption);
        renderTrackingOption();
        renderSenderState();
        populateRecipientSelect();

        renderRecipientChips("ccChips", "cc");
        renderRecipientChips("bccChips", "bcc");
        updateRecipientToggleCounts();

        if (context.actionMode === "schedule") {
          document.getElementById("scheduleFields").classList.remove("hidden");
          initializeScheduleFields();
          renderTriggerState();
        }

        if (selectedRowCount < 1) {
          document.getElementById("selectionWarning").classList.remove("hidden");
        } else {
          document.getElementById("selectionWarning").classList.add("hidden");
        }

        updateSubmitButton();
      }

      function populateSelect(id, values) {
        const select = document.getElementById(id);
        select.innerHTML = "";

        if (!values.length) {
          const option = document.createElement("option");
          option.value = "";
          option.textContent = "No options found";
          select.appendChild(option);
          return;
        }

        values.forEach(function(value) {
          const option = document.createElement("option");
          option.value = value;
          option.textContent = value;
          select.appendChild(option);
        });
      }

      function selectedTemplateHasTrackingColumn() {
        const template = document.getElementById("template").value;
        return !!((context.templateTracking || {})[template]);
      }

      function renderTrackingOption() {
        const template = document.getElementById("template").value;
        const option = document.getElementById("trackingOption");
        const checkbox = document.getElementById("createTrackingColumn");
        const helper = document.getElementById("trackingHelper");

        if (template !== lastTrackingTemplate) checkbox.checked = false;
        lastTrackingTemplate = template;

        if (!template || selectedTemplateHasTrackingColumn()) {
          option.classList.add("hidden");
        } else {
          helper.textContent = context.actionMode === "schedule"
            ? "Required for scheduled status and cancellation."
            : "Optional. Sent results are always recorded in the Sent sheet.";
          option.classList.remove("hidden");
        }
        updateSubmitButton();
      }

      function renderSenderState() {
        const ready = document.getElementById("senderReady");
        const onboarding = document.getElementById("senderOnboarding");
        const blocking = document.getElementById("senderBlockingError");
        const state = context.senderState || { status: "blocked" };

        ready.classList.add("hidden");
        onboarding.classList.add("hidden");
        blocking.classList.add("hidden");

        if (context.blockingError) {
          blocking.textContent = context.blockingError;
          blocking.classList.remove("hidden");
          return;
        }

        if (state.status === "duplicate") {
          blocking.textContent =
            "Duplicate sender profiles exist for " + context.authenticatedEmail +
            ". Remove the duplicate rows from the Senders sheet before continuing.";
          blocking.classList.remove("hidden");
          return;
        }

        if (state.status === "ready" && state.record) {
          document.getElementById("senderDisplayName").textContent = state.record.name;
          document.getElementById("senderDisplayEmail").textContent = context.authenticatedEmail;
          ready.classList.remove("hidden");
          return;
        }

        document.getElementById("senderProfileEmail").value = context.authenticatedEmail || "";
        if (state.record) {
          document.getElementById("senderProfileName").value = state.record.name || "";
          document.getElementById("senderProfileSignature").value = state.record.signature || "";
        }
        onboarding.classList.remove("hidden");
        setTimeout(function() {
          document.getElementById("senderProfileName").focus();
        }, 0);
      }

      function renderTriggerState() {
        const element = document.getElementById("triggerState");
        const state = context.triggerState || { status: "unknown" };

        if (state.status === "ready") {
          element.textContent = "Scheduled sending is ready for your account.";
        } else if (state.status === "duplicate" || state.status === "invalid") {
          element.textContent = "Scheduling is blocked: the existing trigger must be resolved.";
        } else {
          element.textContent = "A five-minute trigger will be verified when you schedule.";
        }
      }

      function populateRecipientSelect() {
        const select = document.getElementById("toField");
        const fields = context.recipientFields || [];
        select.innerHTML = "";

        if (!fields.length && !context.authenticatedEmail) {
          const option = document.createElement("option");
          option.value = "";
          option.textContent = "No email fields found";
          select.appendChild(option);
          return;
        }

        fields.forEach(function(field) {
          const option = document.createElement("option");
          option.value = JSON.stringify({
            value: field.header,
            valueType: "field"
          });
          option.textContent = field.label;
          select.appendChild(option);
        });

        const senderOption = document.createElement("option");
        senderOption.value = JSON.stringify({
          value: "__SELECTED_SENDER__",
          valueType: "selectedSender"
        });
        senderOption.textContent = "Sender";
        select.appendChild(senderOption);
      }

      function renderRecipientChips(containerId, type) {
        const container = document.getElementById(containerId);
        const fields = context.recipientFields || [];
        container.innerHTML = "";

        if (!fields.length && !context.authenticatedEmail) {
          const empty = document.createElement("p");
          empty.className = "empty-state";
          empty.textContent = "No recipient fields or senders found.";
          container.appendChild(empty);
          return;
        }

        fields.forEach(function(field) {
          const chip = document.createElement("button");
          chip.type = "button";
          chip.className = "recipient-chip";
          chip.textContent = field.label;
          chip.dataset.value = field.header;
          chip.dataset.valueType = "field";
          chip.dataset.type = type;
          chip.onclick = function() {
            chip.classList.toggle("active");
            updateRecipientToggleCounts();
          };

          container.appendChild(chip);
        });

        if (context.authenticatedEmail) {
          const chip = document.createElement("button");
          chip.type = "button";
          chip.className = "recipient-chip";
          chip.textContent = "Sender";
          chip.title = context.authenticatedEmail;
          chip.dataset.value = context.authenticatedEmail;
          chip.dataset.valueType = "email";
          chip.dataset.type = type;
          chip.onclick = function() {
            chip.classList.toggle("active");
            updateRecipientToggleCounts();
          };

          container.appendChild(chip);
        }
      }

      function toggleRecipientPanel(type) {
        const panel = document.getElementById(type + "Panel");
        const isHidden = panel.classList.contains("hidden");

        panel.classList.toggle("hidden", !isHidden);
        updateRecipientToggleCounts();
      }

      function updateRecipientToggleCounts() {
        ["cc", "bcc"].forEach(function(type) {
          const toggle = document.getElementById(type + "Toggle");
          const panel = document.getElementById(type + "Panel");
          const count = getSelectedRecipientItems(type).length;
          const isHidden = panel.classList.contains("hidden");

          const baseText = isHidden
            ? "+ " + type.toUpperCase()
            : "Hide " + type.toUpperCase();

          toggle.textContent = count > 0
            ? baseText + " (" + count + ")"
            : baseText;
        });
      }

      function getSelectedRecipientItems(type) {
        return Array.from(document.querySelectorAll('.recipient-chip[data-type="' + type + '"].active'))
          .map(chip => {
            return {
              value: chip.dataset.value,
              valueType: chip.dataset.valueType || "field"
            };
          })
          .filter(item => item.value);
      }

      function parseRecipientSelectValue(rawValue) {
        if (!rawValue) return "";

        try {
          return JSON.parse(rawValue);
        } catch (err) {
          return {
            value: rawValue,
            valueType: "field"
          };
        }
      }

      function padLocalDatePart(value) {
        return String(value).padStart(2, "0");
      }

      function formatLocalDateInputValue(date) {
        return date.getFullYear() + "-" +
          padLocalDatePart(date.getMonth() + 1) + "-" +
          padLocalDatePart(date.getDate());
      }

      function detectBrowserTimeZone() {
        return Intl.DateTimeFormat().resolvedOptions().timeZone || "";
      }

      function getFriendlyTimeZoneLabel(date, timeZone) {
        const zone = timeZone || "your browser timezone";

        try {
          const longName = new Intl.DateTimeFormat(undefined, {
            timeZoneName: "long"
          }).formatToParts(date).find(part => part.type === "timeZoneName");
          const shortName = new Intl.DateTimeFormat(undefined, {
            timeZoneName: "short"
          }).formatToParts(date).find(part => part.type === "timeZoneName");
          const names = [longName && longName.value, shortName && shortName.value]
            .filter(Boolean)
            .filter((value, index, list) => list.indexOf(value) === index);

          return names.length ? names.join(" (") + (names.length > 1 ? ")" : "") + " — " + zone : zone;
        } catch (err) {
          return zone;
        }
      }

      function formatScheduledDisplayText(date) {
        try {
          return new Intl.DateTimeFormat(undefined, {
            year: "numeric",
            month: "short",
            day: "numeric",
            hour: "numeric",
            minute: "2-digit",
            timeZoneName: "short"
          }).format(date);
        } catch (err) {
          return date.toString();
        }
      }

      function createSchedulePayload(dateValue, timeValue, nowValue) {
        const dateMatch = String(dateValue || "").match(/^(\d{4})-(\d{2})-(\d{2})$/);
        const timeMatch = String(timeValue || "").match(/^(\d{2}):(\d{2})$/);

        if (!dateMatch || !timeMatch) {
          throw new Error("Choose a date and time.");
        }

        const selectedDate = new Date(
          Number(dateMatch[1]),
          Number(dateMatch[2]) - 1,
          Number(dateMatch[3]),
          Number(timeMatch[1]),
          Number(timeMatch[2]),
          0,
          0
        );

        const matchesWallTime =
          selectedDate.getFullYear() === Number(dateMatch[1]) &&
          selectedDate.getMonth() === Number(dateMatch[2]) - 1 &&
          selectedDate.getDate() === Number(dateMatch[3]) &&
          selectedDate.getHours() === Number(timeMatch[1]) &&
          selectedDate.getMinutes() === Number(timeMatch[2]);

        if (!matchesWallTime || isNaN(selectedDate.getTime())) {
          throw new Error("Choose a valid local date and time.");
        }

        const now = nowValue ? new Date(nowValue) : new Date();

        if (selectedDate.getTime() <= now.getTime()) {
          throw new Error("Scheduled time must be in the future.");
        }

        return {
          scheduledForIso: selectedDate.toISOString(),
          scheduledTimeZone: detectBrowserTimeZone(),
          scheduledDisplayText: formatScheduledDisplayText(selectedDate)
        };
      }

      function initializeScheduleFields() {
        const tomorrow = new Date();
        tomorrow.setDate(tomorrow.getDate() + 1);

        document.getElementById("scheduleDate").value = formatLocalDateInputValue(tomorrow);
        document.getElementById("scheduleTime").value = "08:03";

        const timeZone = detectBrowserTimeZone();
        document.getElementById("scheduleTimeZone").textContent =
          "Selected date and time are interpreted in " +
          getFriendlyTimeZoneLabel(new Date(), timeZone) + ".";
      }

      function saveInlineSenderProfile() {
        const button = document.getElementById("saveSenderButton");
        const errorElement = document.getElementById("senderProfileError");
        const name = document.getElementById("senderProfileName").value.trim();

        if (!name) {
          errorElement.textContent = "Sender name is required.";
          errorElement.classList.remove("hidden");
          document.getElementById("senderProfileName").focus();
          return;
        }

        errorElement.classList.add("hidden");
        button.disabled = true;
        button.textContent = "Saving…";

        google.script.run
          .withSuccessHandler(function(result) {
            context.senderState = result.senderState;
            renderSenderState();
            button.disabled = false;
            button.textContent = "Save profile";
            updateSubmitButton();
          })
          .withFailureHandler(function(error) {
            errorElement.textContent = error && error.message
              ? error.message
              : "Sender profile could not be saved.";
            errorElement.classList.remove("hidden");
            button.disabled = false;
            button.textContent = "Save profile";
          })
          .saveSenderProfile({
            name: name,
            email: context.authenticatedEmail,
            signature: document.getElementById("senderProfileSignature").value
          });
      }

      function getActionButtonText(action, count, inProgress) {
        const numericCount = Number(count || 0);
        const noun = numericCount === 1 ? "Email" : "Emails";
        const verb = action === "schedule"
          ? (inProgress ? "Scheduling" : "Schedule")
          : (inProgress ? "Sending" : "Send");
        return verb + " " + numericCount + " " + noun + (inProgress ? "…" : "");
      }

      function canSubmit() {
        const senderReady = context.senderState && context.senderState.status === "ready";
        const blockedTrigger = context.actionMode === "schedule" &&
          context.triggerState &&
          (context.triggerState.status === "duplicate" || context.triggerState.status === "invalid");
        const trackingBlocked = context.actionMode === "schedule" &&
          !selectedTemplateHasTrackingColumn() &&
          !document.getElementById("createTrackingColumn").checked;
        return !isSubmitting && !context.blockingError && senderReady &&
          !blockedTrigger && !trackingBlocked && selectedRowCount > 0;
      }

      function updateSubmitButton() {
        const button = document.getElementById("submitButton");
        button.disabled = !canSubmit();
        if (!isSubmitting) {
          setSubmitButtonState(
            "",
            getActionButtonText(context.actionMode, selectedRowCount, false)
          );
        }
      }

      function showCompletionMessage(result) {
        const element = document.getElementById("completionMessage");
        const sent = Number(result.sent || 0);
        const scheduled = Number(result.scheduled || 0);
        const failed = Number(result.failed || 0);
        const successful = sent + scheduled;
        const actionWord = context.actionMode === "schedule" ? "scheduled" : "sent";

        element.classList.remove("hidden", "error", "success");
        if (failed) {
          element.classList.add("error");
          element.textContent = successful + " " + actionWord + " · " + failed + " failed";
          const errors = (result.errors || []).map(item =>
            "Row " + item.row + ": " + item.error
          );
          if (errors.length) element.textContent += "\n" + errors.join("\n");
        } else {
          element.classList.add("success");
          element.textContent = successful + " " +
            (successful === 1 ? "email " : "emails ") + actionWord;
        }
      }

      function submitForm() {
        if (isSubmitting) return;

        const submitButton = document.getElementById("submitButton");
        const cancelButton = document.getElementById("cancelButton");

        const action = context.actionMode;
        const template = document.getElementById("template").value;
        const toField = parseRecipientSelectValue(document.getElementById("toField").value);
        const ccFields = getSelectedRecipientItems("cc");
        const bccFields = getSelectedRecipientItems("bcc");

        let schedulePayload = {};

        if (!template) {
          setSubmitButtonState("failed", "Failed");
          resetSubmitButtonAfterDelay();
          return;
        }

        if (!context.senderState || context.senderState.status !== "ready") {
          const senderError = document.getElementById("senderBlockingError");
          senderError.textContent = "Set up a valid sender profile before continuing.";
          senderError.classList.remove("hidden");
          return;
        }

        if (!toField) {
          setSubmitButtonState("failed", "Failed");
          resetSubmitButtonAfterDelay();
          return;
        }

        if (action === "schedule") {
          try {
            schedulePayload = createSchedulePayload(
              document.getElementById("scheduleDate").value,
              document.getElementById("scheduleTime").value
            );
            document.getElementById("scheduleError").classList.add("hidden");
          } catch (err) {
            const errorElement = document.getElementById("scheduleError");
            errorElement.textContent = err.message;
            errorElement.classList.remove("hidden");
            setSubmitButtonState("failed", "Failed");
            resetSubmitButtonAfterDelay();
            return;
          }
        }

        isSubmitting = true;
        submitButton.disabled = true;
        cancelButton.disabled = true;

        setFormDisabled(true);
        setSubmitButtonState(
          "working",
          getActionButtonText(action, selectedRowCount, true)
        );

        const formData = {
          action: action,
          template: template,
          toField: toField,
          ccFields: ccFields,
          bccFields: bccFields,
          createTrackingColumn: document.getElementById("createTrackingColumn").checked,
          scheduledForIso: action === "schedule" ? schedulePayload.scheduledForIso : "",
          scheduledTimeZone: action === "schedule" ? schedulePayload.scheduledTimeZone : "",
          scheduledDisplayText: action === "schedule" ? schedulePayload.scheduledDisplayText : ""
        };

        google.script.run
          .withSuccessHandler(function(result) {
            const failed = result && result.failed ? Number(result.failed) : 0;
            const sent = result && result.sent ? Number(result.sent) : 0;
            const scheduled = result && result.scheduled ? Number(result.scheduled) : 0;
            const locked = result && result.locked;
            const successful = sent + scheduled;

            isSubmitting = false;
            selectedRowCount = Math.max(selectedRowCount - successful, 0);
            document.getElementById("selectedRowCount").textContent = selectedRowCount;
            showCompletionMessage(result || {});

            if (locked || failed > 0 || (sent + scheduled === 0)) {
              cancelButton.disabled = false;
              setFormDisabled(false);
              updateSubmitButton();
              return;
            }

            const successText = action === "schedule" ? "Scheduled" : "Sent";

            setSubmitButtonState("success", successText);

            setTimeout(function() {
              google.script.host.close();
            }, 700);
          })
          .withFailureHandler(function(error) {
            isSubmitting = false;
            const element = document.getElementById("completionMessage");
            element.textContent = SendMeBotModal.errorText(
              error,
              "The request could not be completed."
            );
            element.classList.remove("hidden", "success");
            element.classList.add("error");
            cancelButton.disabled = false;
            setFormDisabled(false);
            updateSubmitButton();
          })
          .queueSendFormJob(formData);
      }

      function setSubmitButtonState(state, text) {
        const submitButton = document.getElementById("submitButton");

        submitButton.classList.remove(
          "status-working",
          "status-success",
          "status-failed"
        );

        if (state) {
          submitButton.classList.add("status-" + state);
        }

        submitButton.textContent = text;
      }

      function resetSubmitButtonAfterDelay() {
        setTimeout(function() {
          updateSubmitButton();
        }, 1200);
      }

      function setFormDisabled(disabled) {
        document.getElementById("template").disabled = disabled;
        document.getElementById("toField").disabled = disabled;
        document.getElementById("createTrackingColumn").disabled = disabled;

        const scheduleDate = document.getElementById("scheduleDate");
        const scheduleTime = document.getElementById("scheduleTime");

        if (scheduleDate) {
          scheduleDate.disabled = disabled;
        }

        if (scheduleTime) {
          scheduleTime.disabled = disabled;
        }

        document.querySelectorAll(".recipient-chip, .mini-button").forEach(function(button) {
          button.disabled = disabled;
        });
      }

      initializeForm();
    </script>
  </body>
</html>
