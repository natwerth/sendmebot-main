<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <?!= includeHtml_("Modal") ?>
    <style>
      #addSelectOption {
        display: flex;
        align-items: flex-start;
        gap: 8px;
        margin-bottom: 14px;
      }
      #addSelectOption.hidden { display: none; }
      #addSelectColumn {
        width: 16px;
        height: 16px;
        margin: 1px 0 0;
      }
      #recipientGuidance { margin-bottom: 14px; }
    </style>
  </head>

  <body>
    <div class="wrap">

      <div class="field">
        <label for="trackerSheet">Tracker sheet</label>
        <select id="trackerSheet" onchange="renderHeaders()"></select>
      </div>

      <label id="addSelectOption" class="hidden">
        <input id="addSelectColumn" type="checkbox" checked>
        Add the required Select checkbox column to this sheet
      </label>

      <div id="recipientGuidance" class="helper"></div>

      <div class="field">
        <label for="recordIdHeader">Record ID column</label>
        <select id="recordIdHeader"></select>

        <div class="helper">
          Scheduled emails use this value to find the same record after rows are sorted.
        </div>
      </div>

      <div id="error" class="message error" role="alert"></div>

      <div class="button-row">
        <button
          type="button"
          class="secondary"
          onclick="google.script.host.close()"
        >
          Cancel
        </button>

        <button
          id="saveButton"
          type="button"
          class="primary"
          onclick="saveSetup()"
        >
          Save
        </button>
      </div>
    </div>

    <script>
      const context = <?!= contextJson ?>;

      const sheetSelect = document.getElementById("trackerSheet");
      const headerSelect = document.getElementById("recordIdHeader");
      const saveButton = document.getElementById("saveButton");
      const errorElement = document.getElementById("error");

      function initializeSheetOptions() {
        (context.sheets || []).forEach(function(sheet) {
          const option = document.createElement("option");
          option.value = sheet.name;
          option.textContent = sheet.name;
          sheetSelect.appendChild(option);
        });

        sheetSelect.value = context.config.trackerSheetName || "";
      }

      function renderHeaders() {
        const selectedSheet = (context.sheets || []).find(function(sheet) {
          return sheet.name === sheetSelect.value;
        });

        headerSelect.innerHTML = "";

        ((selectedSheet && selectedSheet.headers) || []).forEach(function(header) {
          const option = document.createElement("option");
          option.value = header;
          option.textContent = header;
          headerSelect.appendChild(option);
        });

        if (sheetSelect.value === context.config.trackerSheetName) {
          headerSelect.value = context.config.recordIdHeader || "";
        }

        const needsSelect = !!selectedSheet && !selectedSheet.hasSelectColumn;
        document.getElementById("addSelectOption").classList.toggle("hidden", !needsSelect);
        const emailHeaders = (selectedSheet && selectedSheet.emailHeaders) || [];
        document.getElementById("recipientGuidance").textContent = emailHeaders.length
          ? "Recipient fields found: " + emailHeaders.join(", ") +
            ". You can choose separate To, CC, and BCC fields each time you send."
          : "No email-named columns were detected. Add recipient columns before sending.";
      }

      function saveSetup() {
        clearMessages();

        if (!sheetSelect.value) {
          showError("Select a tracker sheet.");
          return;
        }

        if (!headerSelect.value) {
          showError("Select a Record ID column.");
          return;
        }

        SendMeBotModal.setButtonBusy(
          saveButton,
          true,
          "Saving...",
          "Save"
        );

        google.script.run
          .withSuccessHandler(function() {
            saveButton.textContent = "Saved";

            setTimeout(function() {
              google.script.host.close();
            }, 500);
          })
          .withFailureHandler(function(error) {
            showError(
              SendMeBotModal.errorText(
                error,
                "Setup could not be saved."
              )
            );

            SendMeBotModal.setButtonBusy(
              saveButton,
              false,
              "Saving...",
              "Save"
            );
          })
          .saveSendMeBotSetup({
            trackerSheetName: sheetSelect.value,
            recordIdHeader: headerSelect.value,
            addSelectColumn: document.getElementById("addSelectColumn").checked
          });
      }

      function clearMessages() {
        SendMeBotModal.clearText(["error"]);
      }

      function showError(message) {
        errorElement.textContent =
          message || "Something went wrong.";
      }

      initializeSheetOptions();
      renderHeaders();
    </script>
  </body>
</html>
